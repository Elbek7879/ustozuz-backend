spring.application.name=ustozuz-backend
server.port=${PORT:8080}

# Maxfiy qiymatlar bu yerda YOZILMAYDI.
# Lokal kompyuterda: loyiha ildizidagi config/application.properties (git'ga kirmaydi).
# Serverda (Railway/Render): environment o'zgaruvchilari orqali.

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ustozuz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# JWT (kamida 32 belgi)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=10080

# Frontend manzili (parolni tiklash havolasi uchun) va CORS ruxsat etilgan manzillar (vergul bilan)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors-origins=${CORS_ORIGINS:http://localhost:3000}

# Email (parolni tiklash xati). log = konsolga yoziladi, brevo = haqiqiy xat
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:UstozUz}

# Bo'sh bazaga birinchi marta yoziladigan hisoblar paroli
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.instructor-password=${INSTRUCTOR_PASSWORD:}
